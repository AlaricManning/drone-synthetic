# Dataset version v002: the first trainable build, over the 2026-07-26 corpus.
#
# One config per dataset version, tracked in git, because which runs a dataset
# trains on is the decision most worth being able to look up later. The dataset's
# own manifest records the same thing, but this is the reviewable statement of
# intent that produced it.
#
# No class_map and no mask settings here: those belong to the conversion that
# produced the annotations, and the build reads them back from each run's
# provenance rather than restating them where they could contradict it.
#
# 50 runs, 3000 frames: 35 recession, 15 crossing.

runs:
