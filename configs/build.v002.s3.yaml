split:
  # Whole runs, never frames: consecutive frames of one camera path are
  # near-duplicates, so a frame-level split leaks train data into val.
  mode: by_run

  # 20% of each distribution rather than a flat sample of 50, because recession
  # and crossing come from different configs. Every fifth seed: 7 of 35
  # recession, 3 of 15 crossing, 600 val frames against 2400.
  #
  # Worth being honest about the size of what this measures. 10 runs of one
  # drone model against one sky is a thin validation set, and run-level
  # splitting means its effective size is 10 scenes rather than 600 samples.
  # It checks that renderer and converter agree; it does not establish that a
  # detector generalizes.
  val_runs:
    - run_20260726_041824_1102   # seed 1102
    - run_20260726_042515_1107   # seed 1107
    - run_20260726_043217_1112   # seed 1112
    - run_20260726_043905_1117   # seed 1117
    - run_20260726_044554_1122   # seed 1122
    - run_20260726_045934_1132   # seed 1132
    - run_20260726_052103_1127   # seed 1127
    - run_20260726_110108_2102   # seed 2102
    - run_20260726_110744_2107   # seed 2107
    - run_20260726_111436_2112   # seed 2112

storage:
  raw_root: s3://drone-synthetic-am/raw
  dataset_root: s3://drone-synthetic-am/datasets
