split:
  # Whole runs, never frames: consecutive frames of one camera path are
  # near-duplicates, so a frame-level split leaks train data into val.
  mode: by_run

  # 20% of each distribution rather than a flat sample of 50, because recession
  # and crossing come from different configs: 7 of 35 recession, 3 of 15
  # crossing, 600 val frames against 2400.
  #
  # Worth being honest about the size of what this measures. 10 runs of one
  # drone model against one sky is a thin validation set, and run-level
  # splitting means its effective size is 10 scenes rather than 600 samples.
  # It checks that renderer and converter agree; it does not establish that a
  # detector generalizes.
  #
  # Why this is not v002's split
  # ----------------------------
  # v002 took every fifth seed, which was a clean systematic sample. Measuring
  # contrast then showed that five of those ten runs contain frames whose label
  # is a crisp box over a drone indistinguishable from the sky behind it -- the
  # mask pass renders in clear air, so it cannot tell. Seed 1102 was 40 frames
  # of 60. A validation set is the instrument every later experiment is read
  # with, so wrong labels there do not cost accuracy, they cost the ability to
  # interpret any result at all.
  #
  # Each affected seed is replaced by the nearest seed with no flagged frame,
  # which keeps the sample spread across the seed range rather than clustered:
  #
  #   1102 (40/60 flagged) -> 1101      1117 (7/60)  -> 1116
  #   1112 (23/60)         -> 1111      1127 (21/60) -> 1125
  #   2112 (3/60)          -> 2111
  #
  # What this costs, stated plainly
  # -------------------------------
  # Selecting runs for having no flagged frame selects for high contrast, so
  # this split is easier than the data it validates. The median-of-medians is
  # -47.1 grey levels against -33.2 for the corpus; v002's split sat at -33.9,
  # almost exactly representative. So v002 measured the right distribution with
  # a broken ruler and this measures a slightly optimistic one with a sound
  # ruler. A model scoring well here has not been shown to hold up on the
  # harder skies the training set contains.
  #
  # The right fix is frame-level: drop the frames whose labels are wrong and
  # keep whole runs in the sample, which needs the build's contrast threshold
  # (see docs/plans/dataset-build.md). Until that exists, and until a trained
  # detector says how little contrast is too little, a sound ruler on a slightly
  # easy sample is the better of two flawed options -- and it is a config
  # change, so revisiting it costs one build.
  val_runs:
    - run_20260726_041702_1101   # seed 1101, replaces 1102
    - run_20260726_042515_1107   # seed 1107
    - run_20260726_043055_1111   # seed 1111, replaces 1112
    - run_20260726_043744_1116   # seed 1116, replaces 1117
    - run_20260726_044554_1122   # seed 1122
    - run_20260726_051819_1125   # seed 1125, replaces 1127
    - run_20260726_045934_1132   # seed 1132
    - run_20260726_110108_2102   # seed 2102
    - run_20260726_110744_2107   # seed 2107
    - run_20260726_111300_2111   # seed 2111, replaces 2112

storage:
  raw_root: s3://drone-synthetic-am/raw
  dataset_root: s3://drone-synthetic-am/datasets
