# Dataset version v003: v002's runs, re-converted with contrast, and a
# validation split that does not measure with a broken ruler.
#
# One config per dataset version, tracked in git, because which runs a dataset
# trains on is the decision most worth being able to look up later. The dataset's
# own manifest records the same thing, but this is the reviewable statement of
# intent that produced it.
#
# No class_map and no mask settings here: those belong to the conversion that
# produced the annotations, and the build reads them back from each run's
# provenance rather than restating them where they could contradict it.
#
# Same 50 runs as v002, 3000 frames: 35 recession, 15 crossing. A new version
# rather than an edit for two reasons: a dataset version is immutable once its
# manifest lands, and every annotation was rewritten by the re-conversion at
# converter commit 961fbd6843, which added the contrast field. v002's labels
# describe the same frames measured with less information.

